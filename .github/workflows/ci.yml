name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # test/ 針對的是暫停中的自訂重構 API（handleRun 重寫、tools.js 拆分），
      # 產品層已重設到上游 v0.1.18，因此預期會紅。
      # 功能重貼回上游基線、測試改寫完成後，移除 continue-on-error。
      - run: npm test
        continue-on-error: true
      - run: npm run build
      - run: npm run package
